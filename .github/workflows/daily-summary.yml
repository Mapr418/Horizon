name: Daily Horizon Summary

on:
  schedule:
    # 07:23 Asia/Shanghai; scheduled starts may be delayed by GitHub.
    - cron: '23 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: horizon-daily
  cancel-in-progress: false

jobs:
  daily-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"

      - name: Check DeepSeek secret
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "::error::Add repository secret DEEPSEEK_API_KEY first."
            exit 1
          fi

      - name: Install dependencies
        run: uv sync --frozen

      - name: Prepare configuration
        run: cp data/config.github.json data/config.json

      - name: Run Horizon
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run horizon --hours 24

      - name: Save downloadable reports
        uses: actions/upload-artifact@v4
        with:
          name: horizon-reports
          path: data/summaries/*.md
          if-no-files-found: error
          retention-days: 30

      - name: Set personal site address
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import re, json
          path = Path("docs/_config.yml")
          content = path.read_text()
          url = "https://" + os.environ["OWNER"].lower() + ".github.io"
          baseurl = "/" + os.environ["REPO"]
          content = re.sub(r"(?m)^url:.*$", "url: " + json.dumps(url), content)
          content = re.sub(r"(?m)^baseurl:.*$", "baseurl: " + json.dumps(baseurl), content)
          path.write_text(content)
          PY

      - name: Publish daily site
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true
          publish_branch: gh-pages
          enable_jekyll: true
